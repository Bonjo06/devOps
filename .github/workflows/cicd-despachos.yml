name: CI/CD Back Despachos
on:
  push:
    paths:
      - 'back-Despachos_SpringBoot/**' 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./back-Despachos_SpringBoot/Springboot-API-REST-DESPACHO
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}
      
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push
        run: |
          docker build -t ${{ secrets.ECR_REPO_BACK_DESPACHOS }}:latest .
          docker push ${{ secrets.ECR_REPO_BACK_DESPACHOS }}:latest

      - name: Configurar kubectl
        run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name devopseks
      
      - name: Deploy a EKS
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed -i "s|image: .*|image: ${{ secrets.ECR_REPO_BACK_DESPACHOS }}:latest|g" k8s/despachos.yaml
          kubectl apply -f k8s/despachos.yaml