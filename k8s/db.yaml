apiVersion: v1
kind: Secret
metadata:
  name: mysql-credentials
  namespace: innovatech
type: Opaque
stringData:
  DB_USERNAME: "root"
  DB_PASSWORD: "tiendaperritos123!"
  DB_NAME: "tienda_db"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: innovatech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: DB_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-credentials
              key: DB_NAME
        ports:
        - containerPort: 3306
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: innovatech
spec:
  ports:
    - port: 3306
  selector:
    app: mysql