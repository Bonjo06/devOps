apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: innovatech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: ECR_REPO_FRONTEND_PLACEHOLDER
        env:
        - name: DNS_RESOLVER
          value: "kube-dns.kube-system.svc.cluster.local"
        - name: VENTAS_UPSTREAM
          value: "ventas-service.innovatech.svc.cluster.local:80"
        - name: DESPACHOS_UPSTREAM
          value: "despachos-service.innovatech.svc.cluster.local:80"
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: innovatech
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80