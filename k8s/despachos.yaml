apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-despachos
  namespace: innovatech
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-despachos
  template:
    metadata:
      labels:
        app: backend-despachos
    spec:
      containers:
      - name: despachos
        image: 725770588296.dkr.ecr.us-east-1.amazonaws.com/api-despachos:latest
        env:
        - name: DB_ENDPOINT
          value: "mysql-service" # Este es el nombre del servicio que creamos arriba
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "tienda_db"
        - name: DB_USERNAME
          value: "root"
        - name: DB_PASSWORD
          value: "password123"
        ports:
        - containerPort: 8081
        resources:
          requests:
            cpu: "100m"
          limits:
            cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: despachos-service
  namespace: innovatech
spec:
  type: LoadBalancer
  selector:
    app: backend-despachos
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: despachos-hpa
  namespace: innovatech
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend-despachos
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50